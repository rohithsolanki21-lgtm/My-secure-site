<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secure Site - Login</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        #auth-btn { background: #e94560; color: white; }
        #fingerprint-btn { background: #0f3460; color: white; font-size: 12px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Secure Login</h2>
    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">
    
    <button id="auth-btn">Sign In / Sign Up</button>
    <button id="fingerprint-btn">🖐 Use Fingerprint (Bypass)</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBWMwNv1YHqxrDzgwK5OXUCP5j-oG9uY",
    authDomain: "my--site-b6140.firebaseapp.com",
    projectId: "my--site-b6140"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // LOGIN & SIGN UP LOGIC
  document.getElementById('auth-btn').onclick = function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (email.length < 5 || password.length < 6) {
      alert("Please enter a valid email and a 6-character password.");
      return;
    }

    // Try to Log In
    auth.signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = 'dashboard.html'; })
      .catch((error) => {
        // If account doesn't exist, Create it automatically
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          auth.createUserWithEmailAndPassword(email, password)
            .then(() => { 
              alert("New Account Created!"); 
              window.location.href = 'dashboard.html'; 
            })
            .catch((err) => alert("Error: " + err.message));
        } else {
          alert("Error: " + error.message);
        }
      });
  };

  // FINGERPRINT: Immediate Bypass
  document.getElementById('fingerprint-btn').onclick = function() {
    if (navigator.vibrate) navigator.vibrate(60);
    window.location.href = 'dashboard.html';
  };
</script>

</body>
</html>
